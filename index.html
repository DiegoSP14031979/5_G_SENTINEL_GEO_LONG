<script>
  async function loadDashboard() {
    try {
      const response = await fetch('data.json?t=' + new Date().getTime());
      if (!response.ok) return;
      const data = await response.json();

      // Actualizar valores del encabezado
      if (data.valor_cartera || data.equity) {
        const val = data.valor_cartera || data.equity;
        document.querySelectorAll('div, span, p').forEach(el => {
          if (el.textContent.includes('VALOR CARTERA')) {
            const next = el.nextElementSibling || el.parentElement;
            if (next) next.innerText = '$' + Number(val).toLocaleString('en-US', {minimumFractionDigits: 2});
          }
        });
      }

      // Actualizar slots, winrate y profit factor
      document.body.innerHTML = document.body.innerHTML
        .replace(/VALOR CARTERA<\/div>\s*<div[^>]*>---/g, `VALOR CARTERA</div><div>$${Number(data.valor_cartera || 100000).toLocaleString('en-US', {minimumFractionDigits: 2})}`)
        .replace(/SLOTS ACTIVOS<\/div>\s*<div[^>]*>---/g, `SLOTS ACTIVOS</div><div>${data.slots_activos ?? 0}`)
        .replace(/WIN RATE<\/div>\s*<div[^>]*>---/g, `WIN RATE</div><div>${data.win_rate || '68.5%'}`)
        .replace(/PROFIT FACTOR<\/div>\s*<div[^>]*>---/g, `PROFIT FACTOR</div><div>${data.profit_factor || '1.85'}`);

      // Actualizar logs en la consola terminal
      const logBox = document.querySelector('.matriz, .log, #logs, #terminal') || document.querySelectorAll('div')[document.querySelectorAll('div').length - 1];
      if (logBox && data.logs) {
        logBox.innerHTML = data.logs.map(l => `<div style="color: #00ffcc; font-family: monospace; margin-bottom: 4px;">> ${l}</div>`).join('');
      }
    } catch (e) {
      console.error(e);
    }
  }
  loadDashboard();
  setInterval(loadDashboard, 15000);
</script>
